---
name: build

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        # windows-2019 was retired by GitHub; these are the current images.
        os: [windows-2022, windows-2025]
        # Every released Ruby allowed by required_ruby_version in the gemspec.
        ruby: ['3.1', '3.2', '3.3', '3.4', '4.0']
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    - run: bundle exec rake
